[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-loader"
version = "0.1.0"
description = "Google Drive to Docling to Pinecone document loader"
requires-python = ">=3.11,<3.14"
dependencies = [
  "docling>=2.134,<3",
  "onnxruntime>=1.20,<2",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "openai>=2,<3",
  "pinecone>=7,<9",
  "python-dotenv>=1,<2",
  "filelock>=3.16,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1", "fastapi>=0.115,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
brain-loader = "brain_loader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
